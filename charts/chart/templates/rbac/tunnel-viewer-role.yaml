{{- if .Values.rbac.helpers.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "ktunnels.resourceName" (dict "suffix" "tunnel-viewer-role" "context" $) }}
rules:
- apiGroups:
  - ktunnels.int128.github.io
  resources:
  - tunnels
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ktunnels.int128.github.io
  resources:
  - tunnels/status
  verbs:
  - get
{{- end }}
